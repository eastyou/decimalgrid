[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decimalgrid"
version = "0.1.0"
description = "小数方格图：10×10 涂色读数与小数、百分数、分数互化练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "math", "decimal", "percent", "fraction", "worksheet", "printable", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
decimalgrid = "decimalgrid.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/decimalgrid"
Source = "https://github.com/eastyou/decimalgrid"

[tool.setuptools]
packages = ["decimalgrid"]
